<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - MarketHub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html" class="logo">
            Market<span>Hub</span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="#">Categories</a>
        </nav>

        <a href="cart.html" class="cart">
            🛒
            <span class="cart-count">0</span>
        </a>

    </header>


    <!-- CHECKOUT -->

    <main class="checkout-page">

        <div class="checkout-heading">

            <p class="section-tag">CHECKOUT</p>

            <h1>Complete your purchase</h1>

            <p>
                Enter your delivery information and review your order.
            </p>

        </div>


        <div class="checkout-container">


            <!-- CUSTOMER INFORMATION -->

            <section class="checkout-form">

                <h2>Delivery Information</h2>

                <div class="form-row">

                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input
                            type="text"
                            id="firstName"
                            placeholder="Enter your first name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input
                            type="text"
                            id="lastName"
                            placeholder="Enter your last name"
                        >
                    </div>

                </div>


                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                    >

                </div>


                <div class="form-group">

                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="08012345678"
                    >

                </div>


                <div class="form-group">

                    <label for="address">Delivery Address</label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Enter your delivery address"
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="city">City</label>

                        <input
                            type="text"
                            id="city"
                            placeholder="Enter your city"
                        >

                    </div>


                    <div class="form-group">

                        <label for="state">State</label>

                        <select id="state">

                            <option value="">Select State</option>
                            <option>Lagos</option>
                            <option>Abuja</option>
                            <option>Rivers</option>
                            <option>Enugu</option>
                            <option>Anambra</option>
                            <option>Delta</option>
                            <option>Oyo</option>

                        </select>

                    </div>

                </div>


                <h2 class="payment-title">Payment Method</h2>

                <div class="payment-option">

                    <input
                        type="radio"
                        id="payOnDelivery"
                        name="payment"
                        checked
                    >

                    <label for="payOnDelivery">
                        Cash on Delivery
                    </label>

                </div>


                <div class="payment-option">

                    <input
                        type="radio"
                        id="cardPayment"
                        name="payment"
                    >

                    <label for="cardPayment">
                        Card Payment
                    </label>

                </div>


            </section>


            <!-- ORDER SUMMARY -->

            <aside class="checkout-summary">

                <h2>Order Summary</h2>

                <div id="checkoutItems">

                    <!-- Cart products will appear here -->

                </div>


                <div class="checkout-summary-row">

                    <span>Subtotal</span>

                    <strong id="checkoutSubtotal">
                        ₦0
                    </strong>

                </div>


                <div class="checkout-summary-row">

                    <span>Delivery</span>

                    <strong>
                        ₦2,000
                    </strong>

                </div>


                <div class="checkout-total">

                    <span>Total</span>

                    <strong id="checkoutTotal">
                        ₦2,000
                    </strong>

                </div>


                <button class="place-order-btn">
                    Place Order
                </button>

            </aside>

        </div>

    </main>


    <script src="checkout.js"></script>

</body>

</html>
